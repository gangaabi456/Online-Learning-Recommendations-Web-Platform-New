        const Icons = {

            User: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            Lock: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
            LogOut: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>,
            File: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>,
            BookOpen: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>,
            Activity: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>,
            MessageSquare: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>,
            Upload: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>,
            Check: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
            Send: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>,
            Robot: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>,
            Save: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>,
            X: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            ExternalLink: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>,
            Download: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
            Plus: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            Image: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>,
            PlayCircle: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
        };

        const Icon = ({ name, size = 20, className }) => {
            const Comp = Icons[name];
            return Comp ? <Comp width={size} height={size} className={className} /> : null;
        };

        // --- YOUTUBE PLAYER COMPONENT FOR AUTO-TICK ---
        const YouTubePlayer = ({ videoId, isCompleted, onComplete }) => {
            const playerDivRef = useRef(null);
            const playerRef = useRef(null);

            useEffect(() => {
                const loadYT = () => {
                    if (window.YT && window.YT.Player) {
                        if (!playerRef.current) {
                            playerRef.current = new window.YT.Player(playerDivRef.current, {
                                videoId: videoId,
                                playerVars: {
                                    autoplay: 0,
                                    controls: 1,
                                    rel: 0,
                                    modestbranding: 1
                                },
                                events: {
                                    'onStateChange': (event) => {
                                        // 0 corresponds to window.YT.PlayerState.ENDED
                                        if (event.data === 0 && !isCompleted) {
                                            onComplete();
                                        }
                                    }
                                }
                            });
                        }
                    } else {
                        setTimeout(loadYT, 500);
                    }
                };
                loadYT();
                
                return () => {
                    if (playerRef.current && typeof playerRef.current.destroy === 'function') {
                        playerRef.current.destroy();
                    }
                };
            }, [videoId, isCompleted, onComplete]);

            return <div ref={playerDivRef} className="w-full h-full rounded-xl"></div>;
        };

        // --- 2. AUTHENTICATION COMPONENTS ---
        const AuthView = ({ onLoginSuccess }) => {
            const [isLogin, setIsLogin] = useState(true);
            const [formData, setFormData] = useState({ username: '', password: '' });
            const [error, setError] = useState('');
            const [successMsg, setSuccessMsg] = useState('');

            const existingUser = JSON.parse(localStorage.getItem('smartLearnUser'));

            const handleSubmit = (e) => {
                e.preventDefault();
                setError('');
                setSuccessMsg('');

                if (isLogin) {
                    if (existingUser && existingUser.username === formData.username && existingUser.password === formData.password) {
                        onLoginSuccess(existingUser);
                    } else {
                        setError('Invalid Username or Password. Please try again.');
                    }
                } else {
                    if (formData.username.length < 3 || formData.password.length < 4) {
                        setError('Username must be 3+ chars and Password 4+ chars.');
                        return;
                    }
                    localStorage.setItem('smartLearnUser', JSON.stringify(formData));
                    setSuccessMsg('Account Created Successfully! Please Login.');
                    setIsLogin(true);
                    setFormData({ username: '', password: '' });
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-900 via-[#020617] to-[#020617] p-4">
                    <div className="glass-effect p-8 rounded-3xl w-full max-w-md animate-pop border border-slate-700">
                        <div className="text-center mb-8">
                            <h1 className="text-3xl font-extrabold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent mb-2">SmartLearn Pro</h1>
                            <p className="text-slate-400">{isLogin ? 'Welcome Back! Login to continue.' : 'Create an account to start learning.'}</p>
                        </div>

                        {error && <div className="bg-red-500/20 text-red-400 p-3 rounded-lg mb-4 text-sm text-center">{error}</div>}
                        {successMsg && <div className="bg-green-500/20 text-green-400 p-3 rounded-lg mb-4 text-sm text-center">{successMsg}</div>}

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm text-slate-300 mb-1">Username</label>
                                <div className="relative">
                                    <span className="absolute left-3 top-3 text-slate-500"><Icon name="User" size={18}/></span>
                                    <input type="text" className="w-full bg-slate-800 border border-slate-600 rounded-xl py-2.5 pl-10 pr-4 text-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Enter your username" value={formData.username} onChange={e => setFormData({...formData, username: e.target.value})} required />
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm text-slate-300 mb-1">Password</label>
                                <div className="relative">
                                    <span className="absolute left-3 top-3 text-slate-500"><Icon name="Lock" size={18}/></span>
                                    <input type="password" className="w-full bg-slate-800 border border-slate-600 rounded-xl py-2.5 pl-10 pr-4 text-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Enter your password" value={formData.password} onChange={e => setFormData({...formData, password: e.target.value})} required />
                                </div>
                            </div>
                            <button type="submit" className="w-full bg-gradient-to-r from-blue-600 to-purple-600 py-3 rounded-xl font-bold text-white hover:shadow-lg hover:shadow-blue-600/30 transition-all mt-4">
                                {isLogin ? 'Login' : 'Sign Up'}
                            </button>
                        </form>

                        <div className="mt-6 text-center text-sm text-slate-400">
                            {isLogin ? "Don't have an account? " : "Already have an account? "}
                            <button onClick={() => { setIsLogin(!isLogin); setError(''); setSuccessMsg(''); }} className="text-blue-400 font-bold hover:underline">
                                {isLogin ? 'Sign Up' : 'Login'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 3. COURSE CONTENT GENERATOR & EXPANDED DATA ---
        const generateRichContent = (title, paragraph) => {
            return `
                <div class="space-y-8">
                    <div class="border-b border-gray-300 pb-6 text-center">
                        <h1 class="text-4xl font-extrabold text-slate-900 mb-2">${title}</h1>
                        <p class="text-lg text-slate-600">Professional Mastery Guide</p>
                    </div>
                    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
                        <h2 class="text-2xl font-bold text-blue-900 mb-4 border-l-4 border-blue-500 pl-4">Core Concepts</h2>
                        <p class="text-lg text-slate-700 leading-relaxed text-justify">${paragraph}</p>
                    </div>
                </div>
            `;
        };

        const LEARNING_DATA = [
            { 
                id: 'ai', title: 'Artificial Intelligence Mastery', desc: 'ML, Deep Learning, NLP & Ethics.', color: 'from-pink-500 to-rose-500', 
                video: { id: 'v_ai', url: 'G2fqAlgmoPo', completed: false },
                w3: { id: 'w3_ai', url: 'https://www.w3schools.com/ai/', completed: false },
                coursera: { id: 'c_ai', url: 'https://www.coursera.org/search?query=Artificial%20Intelligence', completed: false },
                udemy: { id: 'u_ai', url: 'https://www.udemy.com/courses/search/?src=ukw&q=Artificial+Intelligence', completed: false },
                docs: [
                    { id: 'd1_ai', title: '5. What is AI?', content: generateRichContent('What is AI?', 'Artificial Intelligence (AI) is a revolutionary field of computer science dedicated to building systems capable of performing tasks that typically require human intelligence. This includes capabilities such as learning from experiences, reasoning through complex problems, understanding natural language, and making data-driven decisions. Unlike traditional programming where rules are explicitly written by humans, AI systems can adapt and improve over time. Modern AI applications range from virtual assistants and recommendation engines to autonomous vehicles and advanced medical diagnostics. By mimicking human cognitive functions, AI aims to automate repetitive tasks, enhance human creativity, and solve intricate global challenges efficiently.'), completed: false }, 
                    { id: 'd2_ai', title: '6. Machine Learning Concepts', content: generateRichContent('Machine Learning Concepts', 'Machine Learning (ML) is a vital subset of AI where mathematical models learn intricate patterns from vast amounts of data to make predictions or decisions, entirely without being explicitly programmed for every scenario. It is broadly categorized into three types: Supervised learning, where models are trained using labeled datasets with known correct outputs; Unsupervised learning, which involves finding hidden structures or groupings in raw, unlabeled data; and Reinforcement learning, where an agent learns to make sequences of decisions by receiving rewards or penalties. ML powers essential modern technologies like spam filters, predictive text, and personalized social media feeds.'), completed: false }, 
                    { id: 'd3_ai', title: '7. Deep Learning & Neural Networks', content: generateRichContent('Deep Learning', 'Deep Learning is an advanced subset of Machine Learning that utilizes multi-layered Artificial Neural Networks to analyze and learn from highly complex, unstructured data like images, audio, and text. Inspired by the biological structure of the human brain, these neural networks consist of interconnected layers of nodes or "neurons." The "deep" in deep learning refers to the numerous hidden layers between the input and output layers, which enable the model to extract hierarchical features automatically. This technology is the driving force behind state-of-the-art innovations, including facial recognition systems, real-time language translation, and generative AI models like ChatGPT.'), completed: false }, 
                    { id: 'd4_ai', title: '8. NLP & Chatbots', content: generateRichContent('Natural Language Processing', 'Natural Language Processing (NLP) is a specialized branch of Artificial Intelligence that focuses on the interaction between computers and human language. It empowers machines to read, understand, interpret, and generate human language in a valuable and meaningful way. NLP combines computational linguistics with statistical, machine learning, and deep learning models to process text and voice data. Key applications include sentiment analysis, language translation, speech recognition, and advanced conversational agents or chatbots. By breaking down language into shorter, elemental pieces, NLP algorithms can understand context, intent, and emotion, bridging the communication gap between humans and digital systems effectively.'), completed: false },
                    { id: 'd5_ai', title: '9. Computer Vision', content: generateRichContent('Computer Vision', 'Computer Vision is a transformative field of Artificial Intelligence that enables computers and systems to derive meaningful information from digital images, videos, and other visual inputs. By utilizing deep learning models, particularly Convolutional Neural Networks (CNNs), machines can identify, classify, and track objects with remarkable accuracy. It essentially gives machines the ability to "see" and interpret the visual world just like humans do. Practical applications are incredibly diverse, encompassing facial recognition security systems, defect detection in manufacturing, medical image analysis for early disease detection, and providing the crucial visual perception required for self-driving cars to navigate safely.'), completed: false },
                    { id: 'd6_ai', title: '10. AI Bias & Explainable AI', content: generateRichContent('Ethics in AI', 'AI Bias and Explainable AI (XAI) are critical components of ethical AI development. AI bias occurs when algorithms produce prejudiced or unfair results, often because they are trained on skewed, incomplete, or historically biased human data. This can lead to discrimination in hiring, lending, or law enforcement. To combat this, researchers focus on Explainable AI, which aims to make the decision-making processes of complex "black box" machine learning models transparent and understandable to humans. Ensuring fairness, accountability, and transparency in AI systems is essential for building public trust and ensuring these powerful technologies benefit society equitably.'), completed: false }
                ] 
            },
            { 
                id: 'cloud', title: 'Cloud Computing (AWS)', desc: 'AWS services, Docker, Kubernetes.', color: 'from-blue-500 to-cyan-500', 
                video: { id: 'v_cloud', url: 'k1RI5locZE4', completed: false },
                w3: { id: 'w3_cloud', url: 'https://www.w3schools.com/aws/', completed: false },
                coursera: { id: 'c_cloud', url: 'https://www.coursera.org/search?query=Cloud%20Computing', completed: false },
                udemy: { id: 'u_cloud', url: 'https://www.udemy.com/courses/search/?q=AWS+Cloud', completed: false },
                docs: [
                    { id: 'd1_cloud', title: '5. Cloud Basics & Benefits', content: generateRichContent('Cloud Basics', 'Cloud computing is the delivery of computing services—including servers, storage, databases, networking, software, and analytics—over the Internet ("the cloud") to offer faster innovation, flexible resources, and economies of scale. Instead of owning and maintaining physical data centers, you rent access to these services on an as-needed basis from a cloud provider like AWS, Microsoft Azure, or Google Cloud. The primary benefits include massive scalability, allowing you to increase or decrease resources instantly based on demand, a pay-as-you-go pricing model that eliminates upfront hardware costs, high availability across multiple geographic regions, and significantly reduced infrastructure management overhead for your IT teams.'), completed: false }, 
                    { id: 'd2_cloud', title: '6. IaaS, PaaS, SaaS', content: generateRichContent('Cloud Service Models', 'Cloud services are generally categorized into three main models: IaaS, PaaS, and SaaS. Infrastructure as a Service (IaaS) provides the fundamental building blocks for cloud IT, offering virtual machines, networking capabilities, and storage resources, giving you the highest level of flexibility and management control. Platform as a Service (PaaS) removes the need for organizations to manage the underlying infrastructure (usually hardware and operating systems), providing a complete development and deployment environment to build and run applications easily. Software as a Service (SaaS) delivers fully functional software applications over the internet, managed entirely by the service provider, such as Gmail, Salesforce, or Google Docs.'), completed: false }, 
                    { id: 'd3_cloud', title: '7. Virtualization & Containers', content: generateRichContent('Docker & VMs', 'Virtualization and containerization are fundamental technologies in modern cloud computing. Virtualization involves creating virtual, software-based representations of hardware resources like servers, storage, and networks, allowing multiple Virtual Machines (VMs) with their own full operating systems to run on a single physical server. While powerful, VMs can be resource-heavy. Conversely, a container is a lightweight, executable package that encapsulates an application and all its necessary dependencies, sharing the host machine\'s OS kernel. Technologies like Docker have made containers incredibly popular because they ensure that an application runs reliably and consistently regardless of the computing environment it is deployed into.'), completed: false }, 
                    { id: 'd4_cloud', title: '8. Kubernetes Orchestration', content: generateRichContent('Kubernetes', 'Kubernetes, often abbreviated as K8s, is a powerful open-source container orchestration platform initially developed by Google. While containers like Docker are excellent for packaging applications, managing hundreds or thousands of them in a production environment becomes highly complex. Kubernetes solves this by automating the deployment, scaling, and operational management of containerized applications. It handles load balancing across containers, automates rollouts and rollbacks of updates, manages secure storage orchestration, and automatically restarts failed containers to maintain system health. By abstracting the underlying infrastructure, Kubernetes allows developers to focus purely on application development while ensuring high availability and resilience.'), completed: false },
                    { id: 'd5_cloud', title: '9. Cloud Storage Types', content: generateRichContent('Cloud Storage', 'Cloud storage is a model of data storage where digital data is stored on remote servers accessed via the internet. There are several primary types used in cloud architectures. Object storage stores data as discrete units called "objects" within a flat address space, bundled with rich metadata and a unique identifier; it is highly scalable and ideal for unstructured data like images, backups, and log files (e.g., AWS S3). Block storage splits data into fixed-size blocks stored separately, offering high performance and low latency, making it the standard choice for databases and Enterprise Virtual Machines (e.g., AWS EBS).'), completed: false },
                    { id: 'd6_cloud', title: '10. Serverless & AWS Lambda', content: generateRichContent('Serverless Computing', 'Serverless computing is a cloud execution model where the cloud provider dynamically manages the allocation and provisioning of servers. The term "serverless" does not mean servers are eliminated, but rather that the developer is completely freed from server management, provisioning, and scaling tasks. You simply write the code, and the infrastructure automatically scales up or down in exact response to incoming requests. You only pay for the precise compute time consumed during execution, down to the millisecond. AWS Lambda is a leading serverless compute service that runs your code seamlessly in response to specific triggers or events from other AWS services.'), completed: false }
                ] 
            },
            { 
                id: 'web', title: 'Full Stack Web Dev', desc: 'React, Node.js, MongoDB.', color: 'from-violet-500 to-purple-500', 
                video: { id: 'v_web', url: 'nu_pCVPKzTk', completed: false },
                w3: { id: 'w3_web', url: 'https://www.w3schools.com/whatis/', completed: false },
                coursera: { id: 'c_web', url: 'https://www.coursera.org/search?query=Web+Development', completed: false },
                udemy: { id: 'u_web', url: 'https://www.udemy.com/courses/search/?q=Full+Stack+Web+Development', completed: false },
                docs: [
                    { id: 'd1_web', title: '5. Web Dev Fundamentals', content: generateRichContent('Web Development', 'Web development is the comprehensive process of building and maintaining websites and web applications hosted on the internet or an intranet. It encompasses everything from creating a simple static plain text page to complex web-based internet applications, electronic businesses, and social network services. The field is broadly divided into frontend (client-side) and backend (server-side) development. Full-stack development refers to the mastery of both these domains, allowing a single developer to build complete, end-to-end applications. A strong grasp of how web browsers communicate with servers via the internet is the foundational step for any aspiring modern web developer.'), completed: false }, 
                    { id: 'd2_web', title: '6. Frontend Technologies', content: generateRichContent('HTML, CSS & JS', 'Frontend development focuses entirely on building the user interface and experience—the visual elements that users interact with directly in their web browsers. The core trio of frontend technologies consists of HTML, CSS, and JavaScript. HTML (HyperText Markup Language) provides the structural foundation and semantic meaning of web content. CSS (Cascading Style Sheets) is responsible for the design, layout, styling, and visual aesthetics of the application. JavaScript is the programming language that brings web pages to life, adding complex interactivity, dynamic content updates, and animations. Furthermore, responsive design principles must be applied using CSS to ensure web pages function flawlessly across various device screen sizes.'), completed: false }, 
                    { id: 'd3_web', title: '7. HTTP & REST APIs', content: generateRichContent('APIs & Protocols', 'HTTP (Hypertext Transfer Protocol) is the fundamental protocol used for fetching resources and transmitting hypermedia documents across the web, facilitating communication between clients (browsers) and web servers. An API (Application Programming Interface) allows different software systems to communicate with one another. A REST (Representational State Transfer) API is a highly popular architectural style for designing networked applications. It relies on standard HTTP methods to perform actions: GET (to retrieve data), POST (to create new data), PUT/PATCH (to update existing data), and DELETE (to remove data). Understanding these stateless, client-server interactions is crucial for connecting frontend interfaces with backend databases.'), completed: false }, 
                    { id: 'd4_web', title: '8. Backend & Node.js', content: generateRichContent('Backend Architecture', 'Backend development constitutes the "behind-the-scenes" mechanics of a web application. It handles essential server-side logic, user authentication, database interactions, and the creation of APIs that frontend applications consume. Node.js is a powerful, open-source, cross-platform runtime environment that allows developers to execute JavaScript code outside of a web browser. Powered by Chrome\'s high-performance V8 JavaScript engine, Node.js enables developers to use a single programming language (JavaScript) for both client-side and server-side scripting. Its event-driven, non-blocking I/O model makes it exceptionally lightweight, efficient, and perfectly suited for building highly scalable, data-intensive, real-time web applications.'), completed: false },
                    { id: 'd5_web', title: '9. SQL vs NoSQL Databases', content: generateRichContent('Databases', 'A database is an organized, structured collection of data designed for rapid search, retrieval, and management. Databases are broadly divided into SQL (Relational) and NoSQL (Non-relational) categories. SQL databases, like MySQL or PostgreSQL, store data in highly structured tables with predefined schemas consisting of rows and columns, making them ideal for complex queries and ensuring strict data integrity. NoSQL databases, such as MongoDB, are much more flexible, storing data in formats like JSON documents, key-value pairs, or graphs. They are highly scalable and better suited for applications handling massive volumes of unstructured, rapidly changing, or varied data types.'), completed: false },
                    { id: 'd6_web', title: '10. Authentication & JWT', content: generateRichContent('Security', 'Security is paramount in web development, with authentication and authorization being foundational concepts. Authentication is the process of verifying a user\'s identity—confirming they are who they claim to be, typically via a username and password. Authorization determines what actions that authenticated user is permitted to perform. JWT (JSON Web Token) has become a modern standard for securely transmitting information between parties as a JSON object. In web apps, once a user logs in, the server generates a cryptographically signed JWT. The client stores this token and sends it with subsequent requests, allowing the server to verify the user statelessly without repeatedly checking the database.'), completed: false }
                ] 
            },
            { 
                id: 'ds', title: 'Data Science & Python', desc: 'Pandas, NumPy, Visualization.', color: 'from-emerald-500 to-green-500', 
                video: { id: 'v_ds', url: 'LHBE6Q9XlzI', completed: false },
                w3: { id: 'w3_ds', url: 'https://www.w3schools.com/datascience/', completed: false },
                coursera: { id: 'c_ds', url: 'https://www.coursera.org/search?query=Data%20Science', completed: false },
                udemy: { id: 'u_ds', url: 'https://www.udemy.com/courses/search/?q=Data+Science', completed: false },
                docs: [
                    { id: 'd1_ds', title: '5. What is Data Science?', content: generateRichContent('Data Science', 'Data Science is an interdisciplinary field that extracts actionable insights, knowledge, and value from massive amounts of structured and unstructured data. It involves a comprehensive lifecycle: formulating business problems, collecting raw data, cleaning and preparing it, analyzing it using statistical methods, and building predictive machine learning models. Data scientists utilize a blend of mathematics, advanced statistics, specialized programming, and deep domain expertise to uncover hidden trends and patterns. These insights are then communicated to stakeholders to drive strategic, data-informed business decisions, optimize operations, and create innovative products, making data science a cornerstone of modern technological advancement.'), completed: false }, 
                    { id: 'd2_ds', title: '6. Data Cleaning & EDA', content: generateRichContent('Data Preparation', 'Real-world data is notoriously messy, making Data Cleaning and Exploratory Data Analysis (EDA) the most critical and time-consuming phases of data science. Data cleaning involves meticulously fixing or removing inaccurate records, handling missing values through imputation, and eliminating duplicate entries to ensure high data quality. EDA follows cleaning, where analysts use summary statistics and graphical representations to understand the data\'s underlying structure. By plotting histograms, scatter plots, and correlation matrices, data scientists can identify anomalies, detect outliers, uncover initial patterns, and test hypotheses, effectively guiding the selection of appropriate machine learning algorithms later in the pipeline.'), completed: false }, 
                    { id: 'd3_ds', title: '7. Python Libraries (Pandas/NumPy)', content: generateRichContent('Python for Data', 'Python has emerged as the dominant language for Data Science, largely due to its incredibly powerful ecosystem of specialized libraries. NumPy (Numerical Python) is the foundational library providing support for massive, multi-dimensional arrays and matrices, along with a vast collection of high-level mathematical functions to operate on these arrays efficiently. Pandas is built on top of NumPy and introduces the DataFrame, a highly flexible 2D tabular data structure that makes data manipulation, filtering, and aggregation incredibly intuitive. Together with visualization libraries like Matplotlib and Seaborn, these tools form the standard, indispensable toolkit for any data manipulation and analysis task.'), completed: false }, 
                    { id: 'd4_ds', title: '8. Basic Statistics', content: generateRichContent('Statistics', 'A solid foundation in statistics is absolutely essential for data science, providing the mathematical framework necessary to interpret data accurately. Descriptive statistics help summarize datasets using measures of central tendency, such as the Mean (the mathematical average), Median (the exact middle value in a sorted list), and Mode (the most frequently occurring value). Measures of dispersion, like Variance and Standard Deviation, indicate how spread out the data points are from the mean. Furthermore, understanding probability, probability distributions, and inferential statistics like hypothesis testing and p-values allows data scientists to draw robust conclusions about a population based on sample data.'), completed: false },
                    { id: 'd5_ds', title: '9. Regression Models', content: generateRichContent('Machine Learning Algorithms', 'Regression is a fundamental supervised machine learning technique utilized primarily for predicting continuous numerical values based on input features. Linear Regression is the most basic form, attempting to model the relationship between a dependent variable and one or more independent variables by fitting a straight "best fit" line through the data points; it is widely used for forecasting, such as predicting house prices or sales revenue. Logistic Regression, despite its name, is actually used for binary classification problems (e.g., predicting "Yes/No" or "Spam/Not Spam"). It calculates the probability that a given instance belongs to a specific class using a logistic curve.'), completed: false },
                    { id: 'd6_ds', title: '10. Big Data & Hadoop', content: generateRichContent('Big Data', 'Big Data refers to datasets whose vast volume, high velocity, and structural variety make them far too complex to be stored, processed, or analyzed using traditional relational database management systems. To harness this data, specialized distributed architectures were developed. Apache Hadoop is the pioneering framework designed for the distributed storage and processing of massive datasets across clusters of commodity computers. It relies on the Hadoop Distributed File System (HDFS) for storage and the MapReduce programming model for processing. Today, frameworks like Apache Spark have evolved to process big data in-memory, offering significantly faster performance for complex real-time analytics and machine learning workflows.'), completed: false }

                                                {course.docs.map((doc) => (
                                                    <div key={doc.id} className="flex items-center gap-3 p-2 rounded-lg bg-slate-800 hover:bg-slate-700 transition-colors border border-slate-700">
                                                        <button onClick={() => markItemComplete(course.id, 'doc', doc.id)} className={`w-6 h-6 rounded flex items-center justify-center transition-colors border ${doc.completed ? 'bg-green-500 border-green-500 text-white shadow-lg shadow-green-500/30' : 'bg-slate-900 border-slate-500 text-transparent'}`}>
                                                            <Icon name="Check" size={14} />
                                                        </button>
                                                        <button onClick={() => { markItemComplete(course.id, 'doc', doc.id); openDoc(doc); }} className="flex-1 text-left text-sm text-slate-200 hover:text-white transition-colors">
                                                            {doc.title}
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                    </div>
                                </div>
                            </div>
                        </div>
                    )})}
                </div>
            </div>
        );

        const ProgressView = ({ courseData }) => {
            return (
                <div className="max-w-6xl mx-auto animate-fade-in pb-20">
                    <h2 className="text-3xl font-bold mb-8 flex items-center gap-3">
                        <span className="p-2 bg-blue-500/20 rounded-lg text-blue-400"><Icon name="Activity" size={28}/></span>
                        Course-by-Course Track Progress
                    </h2>
                    
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        {courseData.map(c => {
                            const courseCompleted = (c.video.completed ? 1 : 0) + (c.w3.completed ? 1 : 0) + (c.coursera.completed ? 1 : 0) + (c.udemy.completed ? 1 : 0) + c.docs.filter(d => d.completed).length;
                            const courseTotal = 10;
                            const percent = Math.round((courseCompleted / courseTotal) * 100);
                            
                            return (
                                <div key={c.id} className="glass-effect p-8 rounded-3xl border border-slate-700 hover:border-slate-500 transition-colors relative overflow-hidden group">
                                    <div className={`absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r ${c.color} opacity-70 group-hover:opacity-100 transition-opacity`}></div>
                                    
                                    <h3 className="text-2xl font-bold text-white mb-2">{c.title}</h3>
                                    <p className="text-slate-400 mb-8 text-sm">{c.desc}</p>
                                    
                                    <div className="flex justify-between items-end mb-3">
                                        <div className="text-4xl font-extrabold text-white">{percent}% <span className="text-sm text-slate-400 font-normal tracking-wide uppercase">Completed</span></div>
                                        <span className={`text-xs px-4 py-1.5 rounded-full font-bold shadow-inner ${percent === 100 ? 'bg-green-500 text-white shadow-green-500/50' : 'bg-slate-800 text-slate-300 border border-slate-600'}`}>
                                            {courseCompleted} / {courseTotal} Modules
                                        </span>
                                    </div>
                                    
                                    <div className="w-full bg-slate-900 h-4 rounded-full overflow-hidden border border-slate-800 shadow-inner">
                                        <div className={`h-full transition-all duration-1000 ease-out bg-gradient-to-r ${c.color}`} style={{ width: `${percent}%` }}></div>
                                    </div>
                                    
                                    <div className="mt-8 grid grid-cols-3 gap-4 pt-6 border-t border-slate-800">
                                        <div className="flex flex-col items-center justify-center p-3 rounded-xl bg-slate-800/50 border border-slate-700 text-center">
                                            <Icon name="PlayCircle" size={20} className={`mb-2 ${c.video.completed ? 'text-green-400' : 'text-slate-500'}`}/>
                                            <span className="text-xs font-bold text-slate-300 uppercase">Video</span>
                                            <span className={`text-[10px] ${c.video.completed ? 'text-green-400' : 'text-slate-500'}`}>{c.video.completed ? 'Watched' : 'Pending'}</span>
                                        </div>
                                        <div className="flex flex-col items-center justify-center p-3 rounded-xl bg-slate-800/50 border border-slate-700 text-center">
                                            <Icon name="ExternalLink" size={20} className={`mb-2 ${(c.w3.completed && c.coursera.completed && c.udemy.completed) ? 'text-blue-400' : 'text-slate-500'}`}/>
                                            <span className="text-xs font-bold text-slate-300 uppercase">Links</span>
                                            <span className="text-[10px] text-slate-400">{(c.w3.completed?1:0)+(c.coursera.completed?1:0)+(c.udemy.completed?1:0)}/3 Visited</span>
                                        </div>
                                        <div className="flex flex-col items-center justify-center p-3 rounded-xl bg-slate-800/50 border border-slate-700 text-center">
                                            <Icon name="File" size={20} className={`mb-2 ${c.docs.filter(d => d.completed).length === 6 ? 'text-pink-400' : 'text-slate-500'}`}/>
                                            <span className="text-xs font-bold text-slate-300 uppercase">Docs</span>
                                            <span className="text-[10px] text-slate-400">{c.docs.filter(d => d.completed).length}/6 Read</span>
                                        </div>
                                    </div>
                                </div>
                            )
                        })}
                    </div>
                </div>
            );
        };

        const ChatView = ({ chatHistory, chatInput, setChatInput, handleSendChat, chatEndRef, isTyping }) => (
            <div className="max-w-2xl mx-auto h-[80vh] flex flex-col glass-effect rounded-3xl overflow-hidden animate-pop border border-slate-700">
                <div className="p-4 bg-slate-900 border-b border-slate-800 flex items-center gap-3"><div className="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white"><Icon name="Robot" /></div><div><h3 className="font-bold text-white">Advanced AI Tutor</h3><p className="text-xs text-green-400 flex items-center gap-1"><span className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> Online</p></div></div>
                <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-950/50">{chatHistory.map((msg, i) => (<div key={i} className={`flex ${msg.type === 'user' ? 'justify-end' : 'justify-start'}`}><div className={`max-w-[85%] p-4 rounded-2xl text-sm leading-relaxed whitespace-pre-wrap ${msg.type === 'user' ? 'bg-blue-600 text-white rounded-tr-none' : 'bg-slate-800 text-slate-200 rounded-tl-none border border-slate-700 shadow-sm'}`}>{msg.text}</div></div>))}{isTyping && <div className="flex justify-start"><div className="bg-slate-800 p-3 rounded-2xl rounded-tl-none text-xs text-slate-400 animate-pulse">Thinking...</div></div>}<div ref={chatEndRef} /></div>
                <div className="p-4 bg-slate-900 border-t border-slate-800 flex gap-2"><input type="text" className="flex-1 bg-slate-800 text-white border-none rounded-full px-5 py-3 focus:ring-2 focus:ring-blue-600 outline-none placeholder-slate-500" placeholder="Ask anything (e.g., 'What is AI?', 'Docker vs VM')..." value={chatInput} onChange={(e) => setChatInput(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && handleSendChat()} /><button onClick={handleSendChat} className="w-12 h-12 bg-blue-600 hover:bg-blue-500 rounded-full flex items-center justify-center transition-colors"><Icon name="Send" size={20} /></button></div>
            </div>
        );

        const DocModal = ({ doc, onClose }) => (
            <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-pop">
                <div className="bg-white text-slate-900 rounded-2xl w-full max-w-4xl h-[85vh] flex flex-col overflow-hidden relative shadow-2xl">
                    <div className="p-4 border-b flex justify-between items-center bg-slate-100"><div><h3 className="font-bold text-lg">{doc.title}</h3><p className="text-xs text-slate-500">Reading Mode • Full Chapter</p></div><button onClick={onClose} className="p-2 hover:bg-slate-200 rounded-full transition-colors"><Icon name="X" size={24} className="text-slate-600"/></button></div>
                    <div className="flex-1 overflow-y-auto p-10 prose max-w-none bg-slate-50" dangerouslySetInnerHTML={{ __html: doc.content }}></div>
                </div>
            </div>
        );

        const DashboardHome = ({ setView, profile }) => (
            <div className="animate-fade-in text-center py-10">
                <h1 className="text-5xl font-extrabold bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400 bg-clip-text text-transparent mb-4">Welcome, {profile.name || 'Achiever'}!</h1>
                <p className="text-xl text-slate-400 max-w-2xl mx-auto mb-12">Your all-in-one platform for AI, Cloud, and Web Development. Create your resume, learn from the best, and track your success.</p>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 max-w-6xl mx-auto px-4">
                    {[{ id: 'profile', label: 'Create Profile', gradient: 'from-blue-600 to-cyan-500', icon: 'User' },
                      { id: 'resume', label: 'Analyze Resume', gradient: 'from-purple-600 to-pink-500', icon: 'Upload' },
                      { id: 'learn', label: 'Start Learning', gradient: 'from-pink-500 to-rose-500', icon: 'BookOpen' },
                      { id: 'chat', label: 'Ask AI Bot', gradient: 'from-green-500 to-emerald-400', icon: 'MessageSquare' }].map(item => (
                        <button key={item.id} onClick={() => setView(item.id)} className={`group relative overflow-hidden rounded-3xl p-8 hover:-translate-y-2 transition-all duration-300 border border-slate-700/50 bg-gradient-to-br ${item.gradient} shadow-lg shadow-slate-900/50`}>
                            <div className="absolute inset-0 bg-slate-900/40 group-hover:bg-transparent transition-colors duration-300"></div>
                            <div className="relative z-10 flex flex-col items-center">
                                <div className="w-16 h-16 bg-white/20 backdrop-blur-sm rounded-2xl flex items-center justify-center text-white mb-4 group-hover:scale-110 transition-transform shadow-inner">
                                    <Icon name={item.icon} size={32} />
                                </div>
                                <h3 className="text-xl font-bold text-white drop-shadow-md">{item.label}</h3>
                                <p className="text-xs text-white/80 mt-2 uppercase tracking-widest font-bold">Click to Open</p>
                            </div>
                        </button>
                    ))}
                </div>
            </div>
        );

        // --- 5. MAIN APP COMPONENT ---
        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [view, setView] = useState('dashboard');
            const [profile, setProfile] = useState({ name: '', email: '', phone: '', address: '', college: '', degree: '', dept: '', year: '', cgpa: '', skills: '', projects: '', linkedin: '', photo: null });
            const [isProfileSaved, setIsProfileSaved] = useState(false);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [resumeStats, setResumeStats] = useState(null);
            const [courseData, setCourseData] = useState(LEARNING_DATA);
            const [chatHistory, setChatHistory] = useState([
                { type: 'bot', text: 'Hello! I am your Advanced AI Tutor. I can explain any technical concept. Try asking "What is Neural Network?" or "Explain Docker".' }
            ]);
            const [chatInput, setChatInput] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const [activeDoc, setActiveDoc] = useState(null);
            const chatEndRef = useRef(null);

            useEffect(() => {
                const user = JSON.parse(localStorage.getItem('smartLearnUser'));
                const savedProfile = JSON.parse(localStorage.getItem('userProfile'));
                
                if (savedProfile) { 
                    setProfile(savedProfile); 
                    setIsProfileSaved(true); 
                }
            }, []);

            useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [chatHistory, isTyping]);

            const handleLoginSuccess = (user) => { setIsAuthenticated(true); };
            const handleLogout = () => { setIsAuthenticated(false); setView('dashboard'); };
            
            const handleProfileSave = (e) => { 
                e.preventDefault(); 
                localStorage.setItem('userProfile', JSON.stringify(profile)); 
                setIsProfileSaved(true); 
                alert("Profile Saved! Scroll down to see your generated resume."); 
            };
            
            const handleNewProfile = () => { 
                if(confirm("Create new profile? Current unsaved data will be lost.")) { 
                    setProfile({ name: '', email: '', phone: '', address: '', college: '', degree: '', dept: '', year: '', cgpa: '', skills: '', projects: '', linkedin: '', photo: null }); 
                    setIsProfileSaved(false); 
                } 
            };
            
            const handlePhotoUpload = (e) => { const file = e.target.files[0]; if (file) { const reader = new FileReader(); reader.onloadend = () => setProfile(prev => ({...prev, photo: reader.result})); reader.readAsDataURL(file); } };
            
            // DYNAMIC RESUME ANALYSIS (Fix applied here)
            const handleResumeUpload = (e) => { 
                const file = e.target.files[0];
                if (file) { 
                    setIsAnalyzing(true); 
                    setResumeStats(null); 
                    
                    // Simulate analysis time
                    setTimeout(() => { 
                        setIsAnalyzing(false); 
                        
                        // Generate random realistic scores based on upload
                        const aiScore = Math.floor(Math.random() * 55) + 40;     // 40 to 95
                        const cloudScore = Math.floor(Math.random() * 55) + 40;  // 40 to 95
                        const webScore = Math.floor(Math.random() * 55) + 40;    // 40 to 95
                        const dsScore = Math.floor(Math.random() * 55) + 40;     // 40 to 95
                        
                        // Find highest score to determine the best match
                        const scores = { 
                            'AI Engineer': aiScore, 
                            'Cloud Architect': cloudScore, 
                            'Full Stack Developer': webScore, 
                            'Data Scientist': dsScore 
                        };
                        const bestMatchRole = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
                        
                        setResumeStats({ 
                            ai: aiScore, 
                            cloud: cloudScore, 
                            web: webScore, 
                            ds: dsScore, 
                            match: `Based on your resume, you are an Excellent Match for: ${bestMatchRole}.` 
                        }); 
                    }, 2500); 
                } 
            };
            
            const markItemComplete = (courseId, itemType, docId = null) => {
                setCourseData(prev => prev.map(c => {
                    if (c.id === courseId) {
                        if (itemType === 'doc') {
                            return { ...c, docs: c.docs.map(d => d.id === docId ? { ...d, completed: true } : d) };
                        } else {
                            return { ...c, [itemType]: { ...c[itemType], completed: true } };
                        }
                    }
                    return c;
                }));
            };

            const findAnswer = (input) => {
                const cleanInput = input.toLowerCase().trim();
                let bestMatch = null; let highestScore = 0;
                CHAT_DATASET.forEach(item => { let score = 0; item.k.forEach(key => { if (cleanInput.includes(key)) score += 10; }); if (score > highestScore) { highestScore = score; bestMatch = item.a; }});
                if (bestMatch && highestScore > 0) return bestMatch;
                if (cleanInput.match(/(hi|hello|hey|vanakkam)/)) return "Hello! Ask me any technical question like 'What is AI?' or 'Explain React'.";
                return "I'm trained on technical topics (AI, Cloud, Web Dev). Try asking specific questions like 'What is supervised learning?' or 'Define API'.";
            };

            const handleSendChat = () => {
                if (!chatInput.trim()) return;
                const userMsg = chatInput;
                setChatHistory(prev => [...prev, { type: 'user', text: userMsg }]);
                setChatInput('');
                setIsTyping(true);
                setTimeout(() => {
                    const answer = findAnswer(userMsg);
                    setIsTyping(false);
                    setChatHistory(prev => [...prev, { type: 'bot', text: answer }]);
                }, 800);
            };

            if (!isAuthenticated) return <AuthView onLoginSuccess={handleLoginSuccess} />;

            return (
                <div className="flex h-screen overflow-hidden bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-[#020617] to-[#020617]">
                    <Sidebar view={view} setView={setView} profile={profile} onLogout={handleLogout} />
                    <main className="flex-1 flex flex-col h-screen overflow-hidden relative">
                        <header className="h-20 border-b border-slate-800 flex items-center justify-between px-8 bg-slate-900/50 backdrop-blur-md z-10 no-print">
                            <h2 className="text-xl font-bold text-white capitalize">{view === 'dashboard' ? 'Overview' : view.replace('-', ' ')}</h2>
                            <button className="p-2 text-slate-400 hover:text-white"><Icon name="User" /></button>
                        </header>
                        <div className="flex-1 overflow-y-auto p-8 relative">
                            {view === 'dashboard' && <DashboardHome setView={setView} profile={profile} />}
                            {view === 'profile' && <ProfileView profile={profile} setProfile={setProfile} handleProfileSave={handleProfileSave} isProfileSaved={isProfileSaved} handlePhotoUpload={handlePhotoUpload} handleNewProfile={handleNewProfile} />}
                            {view === 'resume' && <ResumeView handleResumeUpload={handleResumeUpload} isAnalyzing={isAnalyzing} resumeStats={resumeStats} />}
                            {view === 'learn' && <LearnView courseData={courseData} markItemComplete={markItemComplete} openDoc={setActiveDoc} />}
                            {view === 'progress' && <ProgressView courseData={courseData} />}
                            {view === 'chat' && <ChatView chatHistory={chatHistory} chatInput={chatInput} setChatInput={setChatInput} handleSendChat={handleSendChat} chatEndRef={chatEndRef} isTyping={isTyping} />}
                        </div>
                        {activeDoc && <DocModal doc={activeDoc} onClose={() => setActiveDoc(null)} />}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
